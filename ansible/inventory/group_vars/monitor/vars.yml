---
# Off-site monitoring droplet (provisioned by terraform/, bootstrapped by
# cloud-init to Docker + Tailscale; the app stack is deployed by the
# monitor_stack role via `./run_playbook.sh monitor`).

# Connection — reached over SSH with the dedicated key. Use the PUBLIC IP: the
# tailnet IP routes through Tailscale SSH, which needs interactive auth. Both the
# public and tailnet IPs change on a droplet rebuild — update this and
# monitor_tailscale_ip (below, and its copy in the truenas vars.yml) afterwards.
ansible_host: "170.64.235.189"
ansible_user: root
ansible_ssh_private_key_file: "~/.ssh/homelab-monitor"
ansible_python_interpreter: /usr/bin/python3

monitor_compose_dir: /opt/monitoring
monitor_timezone: "Australia/Sydney"

# This droplet's own Tailscale IP. Loki binds its published port here (tailnet-
# only, no public Caddy site — see defaults/main.yml). Must match
# monitor_tailscale_ip in the truenas vars.yml (same droplet, referenced from
# both places) — update both after a droplet rebuild.
monitor_tailscale_ip: "100.84.249.45"

monitor_kuma_domain: "kuma.griffdawg.dev"
monitor_grafana_domain: "grafana.griffdawg.dev"

# Public HTTPS sites Caddy terminates TLS for (cert via Cloudflare DNS-01) and
# reverse-proxies to a container on the compose network. Caddyfile.j2 and
# docker-compose.yml.j2 both read this list — add an entry here for each new
# public service, no template changes needed. (Loki is intentionally excluded —
# see defaults/main.yml.)
monitor_sites:
  - name: kuma
    domain: "{{ monitor_kuma_domain }}"
    upstream: "uptime-kuma:3001"
  - name: grafana
    domain: "{{ monitor_grafana_domain }}"
    upstream: "grafana:3000"
